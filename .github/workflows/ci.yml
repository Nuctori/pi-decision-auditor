name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx tsx --test test/chain-store.test.ts

  e2e:
    name: E2E - pair audit loop (opencode free model)
    runs-on: ubuntu-latest
    needs: unit
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      PI_OFFLINE: "1"
      PI_DECISION_AUDITOR_INJECT: "off"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        # v4.4.0
        with:
          node-version: 22
      - name: Install pi
        # adhoc npm global install required - pi CLI is the test target itself
        run: npm install -g @earendil-works/pi-coding-agent
      - name: Add npm global bin to PATH
        run: echo "$(npm config get prefix)/bin" >> $GITHUB_PATH
      - name: Install pi-subagents (auditor dependency)
        run: pi install npm:pi-subagents
      - name: Install plugin (local path)
        run: pi install "$GITHUB_WORKSPACE"
      - name: Register auditor agent (local-path workaround)
        run: |
          mkdir -p ~/.pi/agent/agents
          cp "$GITHUB_WORKSPACE/agents/decision-auditor.md" ~/.pi/agent/agents/
      - name: Run E2E - decision_add auto-triggers audit
        run: |
          mkdir -p "$GITHUB_WORKSPACE/e2e" && cd "$GITHUB_WORKSPACE/e2e"
          cat > prompt.txt <<'EOF'
          任务：给 calc.py 加一个除法函数（纯 Python，不引入依赖）。
          请调用 decision_add 记录这条决策：
          summary=保持纯 Python 实现
          context=calc.py 现有 add/sub 两个函数，无任何依赖
          decision=不引入第三方库，纯 Python 实现 div
          rationale=需求只是加一个函数，无依赖必要
          alternatives=引入 numpy（否决：过度设计）
          confidence=high
          记录后等待审计者自动审计（它可能 contact_supervisor 问你，如实回答）。
          最后用 decision_list 读取并报告：链上有几条决策、审计是否发生。
          EOF
          # opencode-go 是免费额度模型：周限额用尽时（429 GoUsageLimitError）跳过 E2E，不红
          pi -p "$(cat prompt.txt)" --model opencode-go/deepseek-v4-flash \
            2>&1 | tee /tmp/e2e/out.txt || true
          if grep -q "GoUsageLimitError" /tmp/e2e/out.txt; then
            echo "SKIP: opencode-go weekly free quota exhausted"
            exit 0
          fi
          grep -q "Error" /tmp/e2e/out.txt && exit 1 || true
      - name: Verify chain and audit state
        run: |
          if grep -q "GoUsageLimitError" /tmp/e2e/out.txt; then
            echo "E2E skipped: opencode-go free quota exhausted"
            exit 0
          fi
          cd "$GITHUB_WORKSPACE/e2e"
          echo "=== chain.md ==="
          cat docs/decisions/chain.md
          echo "=== state.json ==="
          cat .pi/decision-auditor/state.json
          echo "=== assertions ==="
          grep -q "D-001" docs/decisions/chain.md \
            && echo "PASS: chain has D-001"
          grep -q '"lastAuditedId": "D-00' .pi/decision-auditor/state.json \
            && echo "PASS: audit advanced"
          grep -q '"inFlight": false' .pi/decision-auditor/state.json \
            && echo "PASS: lock released"
          grep -qE "审计报告|一致|偏离|需裁决" /tmp/e2e/out.txt \
            && echo "PASS: audit report present" \
            || echo "WARN: report text not matched (model may vary)"
