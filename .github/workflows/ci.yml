name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx tsx --test test/chain-store.test.ts

  e2e:
    name: E2E - pair audit loop (opencode free model)
    runs-on: ubuntu-latest
    needs: unit
    env:
      PI_OFFLINE: "1"
      PI_DECISION_AUDITOR_INJECT: "off"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        # v4.4.0
        with:
          node-version: 22
      - name: Install pi
        # adhoc npm global install required - pi CLI is the test target itself
        run: npm install -g @earendil-works/pi-coding-agent
      - name: Add npm global bin to PATH
        run: echo "$(npm config get prefix)/bin" >> $GITHUB_PATH
      - name: Install pi-subagents (auditor dependency)
        run: pi install npm:pi-subagents
      - name: Install opencode-pi (free no-key model bridge)
        run: pi install npm:opencode-pi
      - name: Install opencode CLI (required by opencode-pi bridge)
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH
      - name: Verify opencode CLI
        run: opencode --version
      - name: Install plugin (local path)
        run: pi install "$GITHUB_WORKSPACE"
      - name: Register auditor agent (local-path workaround)
        run: |
          mkdir -p ~/.pi/agent/agents
          cp "$GITHUB_WORKSPACE/agents/decision-auditor.md" ~/.pi/agent/agents/
      - name: Run E2E - decision_add auto-triggers audit
        run: |
          mkdir -p "$GITHUB_WORKSPACE/e2e" && cd "$GITHUB_WORKSPACE/e2e"
          cat > prompt.txt <<'EOF'
          调用 decision_add 工具记录一条决策，参数严格如下：
          summary=保持纯 Python 实现
          context=calc.py 现有 add/sub 两个函数无依赖
          decision=不引入第三方库
          rationale=需求只是加一个函数
          confidence=high
          只做这一件事，不要运行任何 shell 命令，不要读文件。
          调用完成后用 decision_list 工具确认链上条目。
          EOF
          # opencode-cli 免费模型：无需 key、无需登录（opencode-pi 桥接）
          pi -p "$(cat prompt.txt)" --provider opencode-cli \
            --model opencode/deepseek-v4-flash-free \
            2>&1 | tee "$GITHUB_WORKSPACE/e2e/out.txt" || true
          if grep -q "Error" "$GITHUB_WORKSPACE/e2e/out.txt"; then
            echo "E2E FAILED: see out.txt"
            exit 1
          fi
      - name: Verify chain and audit state
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/e2e/out.txt" ]; then
            echo "E2E FAILED: no run output"
            exit 1
          fi
          echo "=== pi output (first 60 lines) ==="
          head -60 "$GITHUB_WORKSPACE/e2e/out.txt"
          cd "$GITHUB_WORKSPACE/e2e"
          echo "=== chain.md ==="
          cat docs/decisions/chain.md
          echo "=== state.json ==="
          cat .pi/decision-auditor/state.json
          echo "=== assertions ==="
          grep -q "D-001" docs/decisions/chain.md \
            && echo "PASS: chain has D-001"
          grep -q '"lastAuditedId": "D-00' .pi/decision-auditor/state.json \
            && echo "PASS: audit advanced"
          grep -q '"inFlight": false' .pi/decision-auditor/state.json \
            && echo "PASS: lock released"
          grep -qE "审计报告|一致|偏离|需裁决" "$GITHUB_WORKSPACE/e2e/out.txt" \
            && echo "PASS: audit report present" \
            || echo "WARN: report text not matched (print mode exits early)"
